<div id="state_engine_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>State Engine</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="se-row">
                <label class="checkbox_label">
                    <input id="se_enabled" type="checkbox" />
                    <span>Enable State Engine</span>
                </label>
            </div>

            <div class="se-row">
                <label class="checkbox_label">
                    <input id="se_wand_visible" type="checkbox" />
                    <span>Show in Extensions Menu</span>
                </label>
            </div>

            <div class="se-row">
                <label class="checkbox_label">
                    <input id="se_show_tracker_panel" type="checkbox" />
                    <span>Show floating tracker panel</span>
                </label>
            </div>

            <div class="se-row se-actions-row" style="display:flex; flex-wrap:wrap; gap:8px;">
                <button id="se_open_manager" class="menu_button" title="Open the State Engine Manager">
                    <i class="fa-solid fa-sliders"></i>
                    Manager
                </button>
                <div id="se_open_manager_hint" class="se-manager-hint">Select a chat to access the manager.</div>
                <span id="se_status" class="se-status"></span>
            </div>

            <div class="se-row">
                <div class="se-header-row">
                    <label for="se_prompted_header">Prompted update header prompt</label>
                    <button id="se_prompted_header_reset" class="menu_button menu_button_icon" type="button" title="Revert to default">
                    <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>

                <textarea
                    id="se_prompted_header"
                    class="text_pole textarea_compact"
                    rows="4"
                    placeholder="Global instructions for prompted variable updates..."
                ></textarea>

                <small>Applied before preset and variable instructions.</small>
            </div>

            <div class="se-row">
                <div class="se-header-row">
                    <label for="se_prompted_variable_rules_reset">Generated variable rules prompt</label>
                    <button id="se_prompted_variable_rules_reset" class="menu_button menu_button_icon" type="button" title="Revert to default">
                    <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>

                <textarea
                    id="se_prompted_variable_rules"
                    class="text_pole textarea_compact"
                    rows="4"
                    placeholder="Prompted variable update rules..."
                ></textarea>

            </div>
        </div>
    </div>
</div>
