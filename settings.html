<div id="state_engine_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>State Engine</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="se-row">
                <label class="checkbox_label">
                    <input id="se_enabled" type="checkbox" />
                    <span>Enable State Engine</span>
                </label>
            </div>

            <div class="se-row">
                <label class="checkbox_label">
                    <input id="se_show_tracker_panel" type="checkbox" />
                    <span>Show floating tracker panel</span>
                </label>
            </div>

            <div class="se-row se-actions-row" style="display:flex; flex-wrap:wrap; gap:8px;">
                <button id="se_run_now" class="menu_button">
                    <i class="fa-solid fa-rotate"></i>
                    Run prompted updates now
                </button>
                <button id="se_open_manager" class="menu_button" title="Open the State Engine Manager">
                    <i class="fa-solid fa-sliders"></i>
                    Manager
                </button>
                <div id="se_open_manager_hint" class="se-manager-hint">Select a chat to access the manager.</div>
                <span id="se_status" class="se-status"></span>
            </div>

            <div id="se_wand_container" style="display:none;"></div>

        </div>
    </div>
</div>
